apiVersion: apps/v1
kind: Deployment
metadata:
  name: apexkube-agent-metrics
  namespace: "default"
  labels:
    helm.sh/chart: apexkube-agent-2.2.0
    app.kubernetes.io/name: apexkube-agent
    app.kubernetes.io/instance: apexkube-agent
    app.kubernetes.io/version: "1.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apexkube-agent
      app.kubernetes.io/instance: apexkube-agent
      app.kubernetes.io/component: metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apexkube-agent
        app.kubernetes.io/instance: apexkube-agent
        app.kubernetes.io/component: metrics
      annotations:
        checksum/envoy-config: c1617a205b9f113f6ae6670f5e1df6b337c17c4aa4d0558aef671fe03c72625b
        checksum/wireguard-config: af608e8c3143f44baf273a7d6061bc69250500c0755dbb76574bf1411a820e7b
        checksum/wireguard-privatekey: ccf6894cb9c579c049362f8d3a1f18e4c741b16f0ad627e4f37894e70b9a068f
    spec:
      serviceAccountName: apexkube-agent-metrics
      # The metrics agent never calls the Kubernetes API, so it carries no token.
      automountServiceAccountToken: false
      containers:
        # Same image as the access agent: the entrypoint brings up WireGuard and
        # then execs Envoy with the plain-HTTP metrics config.
        - name: agent
          image: "improwised/apexkube-agent:1.0.1"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 10000
              protocol: TCP
          securityContext:
            capabilities:
              add:
              - NET_ADMIN
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 48
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: envoy-config-volume
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy.yaml
            - name: wireguard-config-volume
              mountPath: /etc/wireguard/wg0.conf
              subPath: wg0.conf
            - name: wireguard-privatekey-volume
              mountPath: /etc/wireguard/privatekey
              subPath: privatekey
      volumes:
        - name: envoy-config-volume
          configMap:
            name: apexkube-agent-metrics-envoy-config
        - name: wireguard-config-volume
          configMap:
            name: apexkube-agent-metrics-wireguard-config
        - name: wireguard-privatekey-volume
          secret:
            secretName: apexkube-agent-metrics-wireguard-privatekey
